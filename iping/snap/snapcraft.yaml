grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots

# You have to use 'architectures' for base images core22 or older
architectures:
  - amd64

package-repositories:
  - type: apt
    formats: [deb]
    architectures: [amd64]
    components: [main]
    suites: [bionic]
    key-id: 9014FF9F75C66C771F1CB574BD925DBDACF9B42B
    url: https://packages.irods.org/apt

parts:
  irods-externals:
    plugin: nil
    stage-packages:
      - irods-runtime=4.2.8 # We don't need libc6 or libgcc. They're in the base image.

  irods-iping:
    plugin: dump
    source: https://github.com/vmonecatt/contrib/raw/refs/heads/feature/snap/iping/snap/irods-iping_4.2.8~bionic_amd64.deb
    source-type: deb
    source-checksum: sha512/f924e209289061a8ba0bbb1dc38d5e8ad1c712780629968f09706b1265cd2b7114aaea15551af5e9d095d23f13fd14de32af52b7d1032c352f79ac4f1f5f9bf1

apps:
  irods-iping:
    command: usr/bin/iping
