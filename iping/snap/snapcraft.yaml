name: irods-iping # you probably want to 'snapcraft register <name>'
version: '4.2.8' # just for humans, typically '1.2+git' or '1.3.2'
base: core18
summary: Monitor iRODS with this Nagios-compatible plugin
description: |
  iping is a simple application which will ping the iRODS services on each server.
  This application performs an rcConnect() to an iRODS server given the IP or
  hostname and port.
  The main use of iping is as a monitoring plugin for Nagios.

  This snap comes from https://github.com/irods/contrib, a pooled collection
  of community-contributed code that works alongside iRODS.

