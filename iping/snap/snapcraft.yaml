name: irods-iping # you probably want to 'snapcraft register <name>'
base: core18 # the base snap is the execution environment for this snap
version: '4.2.8' # just for humans, typically '1.2+git' or '1.3.2'
summary: Monitor iRODS with this Nagios-compatible plugin # 79 char long summary
description: |
  This is my-snap's description. You have a paragraph or two to tell the
  most important story about your snap. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the snap
  store.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots

package-repositories:
  - type: apt
    formats: [deb]
    architectures: [amd64]
    components: [main]
    suites: [bionic]
    key-id: 9014FF9F75C66C771F1CB574BD925DBDACF9B42B
    url: https://packages.irods.org/apt

parts:
  irods-externals:
    plugin: nil
    stage-packages:
      - irods-runtime=4.2.8
